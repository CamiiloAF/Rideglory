name: rideglory
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0

  # Code generation for immutable classes
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Backend: Supabase (Postgres + RLS, Auth, Realtime, Storage, Edge Functions)
  supabase_flutter: ^2.10.0

  # Push notifications + analytics only (no Firestore, no Cloud Functions)
  firebase_core: ^4.2.1
  firebase_messaging: ^16.2.0
  firebase_analytics: ^12.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Social authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4

  # DI
  get_it: ^9.2.0
  injectable: ^2.7.1+2

  # Router
  go_router: ^17.0.0

  # Connectivity (offline states)
  connectivity_plus: ^6.1.3

  # Storage
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^10.1.0

  # Utils
  dartz: 0.10.1
  crypto: ^3.0.3
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  google_fonts: ^8.0.2
  image_picker: ^1.2.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.0
  cached_network_image: ^3.4.1
  envied: ^1.3.3
  shimmer: ^3.0.0
  file_picker: ^11.0.2

  # On-device OCR (SOAT autofill)
  google_mlkit_text_recognition: ^0.15.0
  # PDF rasterization for SOAT scanned from a PDF document
  pdfx: ^2.9.2

  # Crash reporting: Sentry SDK, prod-only
  sentry_flutter: ^9.24.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  network_image_mock: ^2.1.1
  patrol: ^4.5.0
  image_picker_platform_interface: ^2.11.1
  integration_test:
    sdk: flutter

  # App launcher icon generation
  flutter_launcher_icons: ^0.14.1

  # Code generation
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  injectable_generator: ^2.7.1
  envied_generator: ^1.3.3


# App launcher icon (Rideglory "R" monogram). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon-master-1024.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0D0D0F"
  adaptive_icon_foreground: "assets/icon/icon-adaptive-fg.png"
  ios: true
  remove_alpha_ios: true

# path_provider_foundation 2.6.0 introduced objective_c 9.x which has native build hooks
# that break dart compile on Linux (CI). Pin to last version without that dependency.
dependency_overrides:
  path_provider_foundation: 2.4.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
patrol:
  test_directory: integration_test

flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon/

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
